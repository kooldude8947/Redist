name: Redist

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   
jobs:
  build:
    runs-on: windows-2022
    steps:

      - name: List dir
        shell: cmd
        run: |
          echo "Listing MSVC..." && dir /S "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\"
          echo "Listing System32.." && dir "C:\Windows\System32"
          echo "Listing System64.." && dir "C:\Windows\System64"
          echo "Listing System.." && dir "C:\Windows\System"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc
          path: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\14.44.35112\x64\Microsoft.VC143.CRT

      - name: Upload again
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc-api
          path: C:\Windows\System32\api-ms-win-core-sysinfo-l1-2-0.dll
