name: Redist

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   
jobs:
  build:
    runs-on: windows-2022
    steps:

      - name: List dir
        shell: cmd
        run: echo "Listing MSVC..." && dir /S "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc
          path: ${{github.workspace}}\azahar\artifacts\
